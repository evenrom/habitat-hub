<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitat</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
</head>
<body>
   <header class="glass-panel sticky-top">
        <div class="brand">HABITAT</div>
        
        <div id="view-toggles" style="display: flex; gap: 8px;">
            <button id="btn-view-rooms" class="view-btn active" style="background: rgba(255,255,255,0.1); border: 1px solid var(--border-light); color: var(--text-primary); padding: 6px 16px; border-radius: 20px; font-family: var(--font-main); font-size: 12px; cursor: pointer; transition: 0.2s;">Rooms</button>
            <button id="btn-view-stores" class="view-btn" style="background: transparent; border: 1px solid transparent; color: var(--text-secondary); padding: 6px 16px; border-radius: 20px; font-family: var(--font-main); font-size: 12px; cursor: pointer; transition: 0.2s;">Stores</button>
        </div>

        <div>
            <button id="open-finance" style="background: transparent; border: 1px solid var(--border-light); color: var(--text-primary); padding: 8px 16px; border-radius: 20px; font-family: var(--font-main); font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background='transparent'">Finance Dashboard</button>
        </div>
    </header>

    <main id="hero-map">
        </main>

    <section id="room-details" class="hidden">
        <h2>Selected Products</h2>
        <div id="carousel-container" class="carousel"></div>
    </section>

    <button id="fab" class="fab-pill"><span>+</span> Add</button>

    <div id="item-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <img id="modal-image" src="" alt="Item Image">
            <h2 id="modal-title"></h2>
            <p id="modal-price" class="price"></p>
            <div id="modal-details" class="details-text"></div>
        </div>
    </div>

    <div id="add-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 550px;">
            <span class="close-button" id="close-add-modal">&times;</span>
            <h2 style="margin-top: 0; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; font-size: 20px;">
                <span style="color: var(--sage-green);">✨</span> Magic AI Add
            </h2>
            
            <div id="add-step-1">
                <input type="file" id="add-file-input" accept="image/png, image/jpeg" style="display: none;">
                <div id="add-dropzone" tabindex="0" style="border: 1px dashed var(--border-light); border-radius: 8px; padding: 40px 20px; text-align: center; margin-bottom: 24px; cursor: pointer; background: rgba(255,255,255,0.02); transition: background 0.3s;" onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background='rgba(255,255,255,0.02)'">
                    <div style="font-size: 24px; margin-bottom: 8px; opacity: 0.8;" id="add-dropzone-icon">📷</div>
                    <div style="font-size: 14px; font-weight: 500;" id="add-dropzone-text">Drop image, click, or Ctrl+V to paste</div>
                    <div style="font-size: 11px; color: var(--text-secondary); margin-top: 6px;">High-resolution JPG or PNG preferred</div>
                </div>
                
                <div style="margin-bottom: 24px;">
                    <label style="display: block; font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px;">Product URL</label>
                    <input id="add-url-input" type="text" placeholder="https://" style="width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border-light); color: var(--text-primary); padding: 12px; border-radius: 6px; box-sizing: border-box; font-family: var(--font-main); outline: none;">
                </div>
            </div>

            <div id="add-step-2" class="hidden">
                <h3 style="font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 1px solid var(--border-light); padding-bottom: 8px; margin-bottom: 16px;">Confirm Details & Crop Image</h3>
                
                <div style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 24px;">
                    <div style="width: 100%; height: 250px; background: rgba(0,0,0,0.5); border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center;">
                        <img id="review-img" src="" style="max-width: 100%; display: block;">
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div style="grid-column: span 2;">
                            <label style="display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text-secondary); text-transform: uppercase;">Name ✏️</label>
                            <input type="text" id="review-name" style="width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border-light); color: var(--text-primary); font-size: 14px; padding: 4px 0; font-family: var(--font-main); outline: none; font-weight: 600;">
                        </div>
                        <div>
                            <label style="display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text-secondary); text-transform: uppercase;">Price (₪) ✏️</label>
                            <input type="number" id="review-price" style="width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border-light); color: var(--text-primary); font-size: 14px; padding: 4px 0; font-family: var(--font-main); outline: none;">
                        </div>
                        <div>
                            <label style="display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text-secondary); text-transform: uppercase;">Store ✏️</label>
                            <input type="text" id="review-store" style="width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border-light); color: var(--text-primary); font-size: 14px; padding: 4px 0; font-family: var(--font-main); outline: none;">
                        </div>
                        <div style="grid-column: span 2; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                            <div>
                                <label style="display: block; font-size: 10px; color: var(--text-secondary); text-transform: uppercase;">L (cm) ✏️</label>
                                <input type="number" id="review-l" style="width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border-light); color: var(--text-primary); font-size: 14px; padding: 4px 0; font-family: var(--font-main); outline: none;">
                            </div>
                            <div>
                                <label style="display: block; font-size: 10px; color: var(--text-secondary); text-transform: uppercase;">W (cm) ✏️</label>
                                <input type="number" id="review-w" style="width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border-light); color: var(--text-primary); font-size: 14px; padding: 4px 0; font-family: var(--font-main); outline: none;">
                            </div>
                            <div>
                                <label style="display: block; font-size: 10px; color: var(--text-secondary); text-transform: uppercase;">H (cm) ✏️</label>
                                <input type="number" id="review-h" style="width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border-light); color: var(--text-primary); font-size: 14px; padding: 4px 0; font-family: var(--font-main); outline: none;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="finance-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 700px;">
            <span class="close-button" id="close-finance-modal">&times;</span>
            <h2 style="margin-top: 0; margin-bottom: 24px; font-size: 20px; letter-spacing: 0.05em;">FINANCIAL OVERVIEW</h2>
            <div id="finance-details" style="max-height: 60vh; overflow-y: auto; padding-right: 8px;">
                </div>
        </div>
    </div>

    <div id="comparison-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 800px; width: 95%;">
            <span class="close-button" id="close-comparison-modal">&times;</span>
            <h2 style="margin-top: 0; margin-bottom: 24px; font-size: 20px; text-transform: uppercase; letter-spacing: 0.05em;">Compare Options</h2>
            
            <div class="comparison-grid">
                <div class="compare-card">
                    <div class="compare-badge current">Current Selection</div>
                    <img id="compare-main-img" src="" alt="Main Item">
                    <h3 id="compare-main-title"></h3>
                    <div class="price" id="compare-main-price"></div>
                    <div class="compare-details" id="compare-main-details"></div>
                </div>

                <div class="compare-card">
                    <div class="compare-badge alternative">Alternative</div>
                    <img id="compare-alt-img" src="" alt="Alternative Item">
                    <h3 id="compare-alt-title"></h3>
                    <div class="price" id="compare-alt-price" style="color: var(--text-primary);"></div>
                    <div class="compare-details" id="compare-alt-details"></div>
                    <button id="btn-select-primary" class="swap-button">Select as Primary ↗</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
