<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitat</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="glass-panel sticky-top">
        <div class="brand">HABITAT</div>
        
        <div class="filters">
            <select id="store-filter" style="background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 8px; font-family: 'Manrope', sans-serif; font-size: 12px; outline: none; cursor: pointer;">
                <option value="All" style="background: #121212;">All Stores</option>
            </select>
        </div>

        <div class="financials">
            <div class="stat">TOTAL <span id="budget-total">₪0</span></div>
            <div class="stat">SPENT <span id="budget-spent">₪0</span></div>
            <div class="stat">REMAINING <span id="budget-remaining">₪0</span></div>
        </div>
    </header>

    <main id="hero-map">
        </main>

    <section id="room-details" class="hidden">
        <h2>Selected Products</h2>
        <div id="carousel-container" class="carousel"></div>
    </section>

    <button id="fab" class="fab">+</button>

    <div id="item-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <img id="modal-image" src="" alt="Item Image">
            <h2 id="modal-title"></h2>
            <p id="modal-price" class="price"></p>
            <div id="modal-details" class="details-text"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
