<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitat Hub v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="glass-panel sticky-top">
        <div class="stat">TOTAL: <span id="budget-total">₪0</span></div>
        <div class="stat">SPENT: <span id="budget-spent">₪0</span></div>
        <div class="stat">REMAINING: <span id="budget-remaining">₪0</span></div>
    </header>

    <main id="hero-map">
        </main>

    <section id="room-details" class="hidden">
        <h2 style="margin-top: 0;">Room Details</h2>
        <div id="carousel-container" class="carousel"></div>
    </section>

    <button id="fab" class="fab">+</button>

    <script type="module" src="js/app.js"></script>
</body>
</html>
