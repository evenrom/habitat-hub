<!DOCTYPE html>
<html lang="en" dir="ltr"> <!-- Default to LTR, but content can be RTL -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habitat Hub</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined|Material+Icons+Round" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">

    <!-- Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">

    <!-- App Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- PWA Manifest (Placeholder) -->
    <!-- <link rel="manifest" href="manifest.json"> -->
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <button id="back-to-rooms" class="icon-btn hidden" aria-label="Back">
                <span class="material-icons-outlined">arrow_back</span>
            </button>
            <h1 id="page-title">Habitat Hub</h1>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle Dark Mode">
                <span class="material-icons-outlined">dark_mode</span>
            </button>
        </header>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- VIEW: ROOMS (Home) -->
            <section id="view-rooms" class="view active">
                <div class="room-list" id="room-list-container">
                    <!-- Room items will be injected here -->
                    <div class="skeleton-loader-room"></div>
                    <div class="skeleton-loader-room"></div>
                    <div class="skeleton-loader-room"></div>
                </div>
            </section>

            <!-- VIEW: ROOM DETAIL (Hidden by default) -->
            <section id="view-room-detail" class="view hidden">
                <h2 id="room-detail-name">Room Name</h2>

                <div class="items-list" id="room-items-container">
                    <!-- Items will be injected here -->
                </div>

                <!-- FAB for Adding Item -->
                <button id="fab-add-item" class="fab" aria-label="Add New Item">
                    <span class="material-icons-outlined">add</span>
                </button>
            </section>

            <!-- VIEW: FLOOR PLAN -->
            <section id="view-floorplan" class="view hidden">
                <div class="panzoom-container" id="panzoom-element">
                    <!-- Placeholder Floor Plan Image -->
                    <img src="https://via.placeholder.com/2000x1500.png?text=Floor+Plan+High+Res" alt="Apartment Floor Plan" id="floorplan-img">
                </div>
                <div class="floorplan-controls">
                    <p class="hint">Pinch to Zoom / Drag to Pan</p>
                    <button class="btn-primary" style="margin-top: 10px;">העלה/החלף תוכנית</button>
                </div>
            </section>

            <!-- VIEW: BUDGET -->
            <section id="view-budget" class="view hidden">
                <div class="budget-card total">
                    <h3>Total Budget</h3>
                    <p class="amount" id="budget-total">₪0</p>
                </div>

                <div class="budget-breakdown">
                    <h3>Breakdown by Room</h3>
                    <div id="budget-list-container">
                        <!-- Budget items injected here -->
                    </div>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-target="view-rooms" aria-label="Rooms">
                <span class="material-icons-outlined">weekend</span>
                <span class="label">Rooms</span>
            </button>
            <button class="nav-item" data-target="view-floorplan" aria-label="Floor Plan">
                <span class="material-icons-outlined">map</span>
                <span class="label">Plan</span>
            </button>
            <button class="nav-item" data-target="view-budget" aria-label="Budget">
                <span class="material-icons-outlined">account_balance_wallet</span>
                <span class="label">Budget</span>
            </button>
        </nav>

        <!-- MODAL: ADD ITEM & CROP -->
        <div id="modal-add-item" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Add New Item</h3>
                    <button class="close-modal" aria-label="Close">
                        <span class="material-icons-outlined">close</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="add-item-form">
                        <div class="form-group">
                            <label for="item-title-input">Item Title</label>
                            <input type="text" id="item-title-input" placeholder="e.g. Velvet Sofa" required>
                        </div>

                        <div class="form-group">
                            <label>Upload Image</label>
                            <input type="file" id="image-upload-input" accept="image/*">
                        </div>

                        <!-- Cropper Container -->
                        <div id="cropper-container" class="hidden">
                            <img id="image-to-crop" src="" alt="To Crop">
                        </div>

                        <div class="form-group">
                            <label for="item-url-input">Product URL</label>
                            <input type="url" id="item-url-input" placeholder="https://..." required>
                        </div>

                        <button type="button" id="btn-analyze" class="btn-primary" disabled>
                            <span class="material-icons-outlined">auto_awesome</span> Analyze with AI
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- MODAL: VALIDATION CARD -->
        <div id="modal-validation" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Review Details</h3>
                    <button class="close-modal" aria-label="Close">
                        <span class="material-icons-outlined">close</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="loading-indicator" class="hidden">
                        <div class="spinner"></div>
                        <p>AI is analyzing your image...</p>
                    </div>

                    <form id="validation-form" class="hidden">
                        <div class="preview-img-container">
                            <img id="val-img-preview" src="" alt="Preview">
                        </div>

                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="val-name" required>
                        </div>

                        <div class="form-group">
                            <label>Price (₪)</label>
                            <input type="number" id="val-price" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>L</label>
                                <input type="text" id="val-dim-l">
                            </div>
                            <div class="form-group">
                                <label>W</label>
                                <input type="text" id="val-dim-w">
                            </div>
                            <div class="form-group">
                                <label>H</label>
                                <input type="text" id="val-dim-h">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Analysis / Tags</label>
                            <textarea id="val-analysis" rows="2" readonly></textarea>
                        </div>

                        <button type="submit" id="btn-save-item" class="btn-primary">Approve & Save</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast hidden">Message</div>

    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
